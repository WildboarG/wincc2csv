```yaml
name: Release WINCC2CSV

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - 386
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          set -e

          VERSION="${GITHUB_REF_NAME}"
          OUT="dist/${GOARCH}"

          mkdir -p "$OUT"

          echo "Building version: $VERSION"
          echo "GOOS=$GOOS"
          echo "GOARCH=$GOARCH"

          go build -trimpath \
            -ldflags="-s -w" \
            -o "$OUT/wincc_admin.exe" \
            ./cmd/admin

          go build -trimpath \
            -ldflags="-s -w" \
            -o "$OUT/wincc_gen.exe" \
            ./cmd/scriptgen

          go build -trimpath \
            -ldflags="-s -w" \
            -o "$OUT/wincc_exporter.exe" \
            ./cmd/exporter-cli

      - name: Package ZIP
        shell: bash
        run: |
          set -e

          VERSION="${GITHUB_REF_NAME}"
          OUT="dist/${GOARCH}"

          cd "$OUT"

          zip -9 \
            "../../wincc2csv-${VERSION}-windows-${GOARCH}.zip" \
            wincc_admin.exe \
            wincc_gen.exe \
            wincc_exporter.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wincc2csv-windows-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/*.exe
            wincc2csv-*.zip

           
  release:
      name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      needs: build
      runs-on: ubuntu-latest

      steps:
      - name: Download artifacts
          uses: actions/download-artifact@v4
          with:
              path: release

      - name: Create Release Notes
          shell: bash
          run: |
          cat > RELEASE.md <<'EOF'
          # WinCC2CSV

          Windows 多架构版本。

          ## 支持平台

          | 平台 | 架构 |
          |---|---|
          | Windows 10/11 | x64 (amd64) |
          | Windows 10/11 | x86 (386) |
          | Windows 10/11 | ARM64 |

          ## 下载

          根据你的 Windows 系统架构下载对应的 ZIP 文件。

          - `amd64`：Intel / AMD 64 位 Windows
          - `386`：32 位 Windows
          - `arm64`：Windows ARM64

          ## 包含程序

          每个 ZIP 包含：

          - `wincc_admin.exe` — 管理终端
          - `wincc_gen.exe` — 脚本生成器
          - `wincc_exporter.exe` — 导出工具

          ## 使用

          下载对应架构的 ZIP 文件，解压后即可使用。

          ## 构建

          本版本由 GitHub Actions 自动构建。

          Go build flags：

          ```text
          -trimpath
          -ldflags="-s -w"
          ```

          ## 注意

          本版本面向 Windows 10 / Windows 11。
          EOF

      - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
              name: WinCC2CSV ${{ github.ref_name }}
              body_path: RELEASE.md
              files: release/**/*.zip release/**/*.exe
              generate_release_notes: true
          
```
